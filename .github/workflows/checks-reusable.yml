name: code-checks (reusable)
description: Workflow that can be called to evaluate any script or folder containing python logic. Used in tandem with built-in Snyk integration.

on:
  workflow_call:
    inputs:
      source_path:
        description: 'Path to Python or JavaScript source directory (optional)'
        required: true
        type: string
      language:
        description: 'Language for Non-container test execution: python, go, node. Leave empty to use the Docker test path.'
        required: false
        type: string
        default: ''
      language_version:
        description: 'Runtime version for the selected language (e.g. 3.13, 1.22, 20)'
        required: false
        type: string
        default: ''
      sonar_project_key:
        description: 'SonarQube project key'
        required: true
        type: string
      sonar_extra_args:
        description: 'Additional sonar-scanner -D args (optional)'
        required: false
        type: string
        default: ''
      dockerfile:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: ''
      docker_context:
        description: 'Docker build context path'
        required: false
        type: string
        default: ''
      docker_image_tag:
        description: 'Tag for the built Docker image'
        required: false
        type: string
        default: ''
      service_name:
        description: 'Service name — used for DD_SERVICE and image tag'
        required: false
        type: string
        default: ''
      environment:
        description: 'Environment — used for DD_ENV'
        required: false
        type: string
        default: ''
      test_command:
        description: 'Test command to run inside the Docker image'
        required: false
        type: string
        default: ''
      docker_target:
        description: 'Docker build stage to target for tests (e.g. tester) — leave empty to use the default final stage'
        required: false
        type: string
        default: ''

jobs:
  checks:
    permissions:
      contents: read
      id-token: write
    runs-on: codebuild-cdap-${{ github.ref_name == 'main' && 'prod' || 'non-prod' }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.0
        with:
          fetch-depth: 0

      - name: Assume role to AWS
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v4.1.0
        with:
          role-to-assume: arn:aws:iam::${{ github.ref_name == 'main' && secrets.PROD_ACCOUNT || secrets.NON_PROD_ACCOUNT }}:role/delegatedadmin/developer/${{ github.ref_name == 'main' && 'cdap-prod' || 'cdap-test' }}-github-actions
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build Image
        if: inputs.dockerfile != ''
        run: |
          docker build \
            -t ${{ inputs.service_name }}:${{ inputs.docker_image_tag }} \
            -f ${{ inputs.dockerfile }} \
            ${{ inputs.docker_context }}

          # if a test stage is specified, build it separately
          if [[ -n "${{ inputs.docker_target }}" ]]; then
            docker build \
              --target ${{ inputs.docker_target }} \
              -t ${{ inputs.service_name }}:${{ inputs.docker_image_tag }}-test \
              -f ${{ inputs.dockerfile }} \
              ${{ inputs.docker_context }}
          fi

      - name: Run Tests and Generate Coverage
        if: inputs.test_command != '' && inputs.dockerfile != ''
        run: |
          SHORT_SHA=$(echo "${{ inputs.docker_image_tag }}" | cut -c1-7)
          mkdir -p /tmp/coverage

          # use the test stage image if specified, otherwise use the production image
          if [[ -n "${{ inputs.docker_target }}" ]]; then
            TEST_IMAGE="${{ inputs.service_name }}:${{ inputs.docker_image_tag }}-test"
          else
            TEST_IMAGE="${{ inputs.service_name }}:${{ inputs.docker_image_tag }}"
          fi

          docker run --rm \
            -v /tmp/coverage:/app/coverage \
            -e DD_SERVICE=${{ inputs.service_name }} \
            -e DD_ENV=${{ inputs.environment }} \
            -e DD_VERSION=$SHORT_SHA \
            -e DD_TRACE_ENABLED=false \
            $TEST_IMAGE \
            sh -c "${{ inputs.test_command }}"

          echo "Coverage dir after run:"
          ls -la /tmp/coverage/

          # find whichever coverage file was produced — xml (Python) or out (Go)
          COVERAGE_FILE=$(find /tmp/coverage -maxdepth 1 \( -name "coverage.*" -o -name "lcov.info" \) | head -1)
          
          if [ -z "$COVERAGE_FILE" ]; then
            echo "ERROR: no coverage file found in /tmp/coverage/"
            exit 1
          fi
          echo "Found coverage file: $COVERAGE_FILE"
          mkdir -p ${{ inputs.source_path }}/src
          
          cp "$COVERAGE_FILE" "${{ inputs.source_path }}/src/$(basename $COVERAGE_FILE)"

      - name: Retrieve credentials
        uses: ./actions/aws-params-env-action
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        with:
          params: |
            SONAR_HOST_URL=/sonarqube/url
            SONAR_TOKEN=/sonarqube/token

      - name: Set up Go (non-container tests)
        if: inputs.language == 'go'
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ inputs.language_version }}

      - name: Set up Node (non-container tests)
        if: inputs.language == 'node'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.language_version }}

      - name: Run Tests and Generate Coverage (non-container)
        if: inputs.test_command != '' && inputs.dockerfile == '' && inputs.language != ''
        working-directory: ${{ inputs.source_path }}
        env:
          DD_TRACE_ENABLED: 'false'
        run: |
          mkdir -p coverage
          sh -c "${{ inputs.test_command }}"

          echo "Coverage dir after run:"
          ls -la coverage/

          COVERAGE_FILE=$(find coverage -maxdepth 1 \( -name "coverage.*" -o -name "lcov.info" \) | head -1)
          if [ -z "$COVERAGE_FILE" ]; then
            echo "ERROR: no coverage file found in ./coverage/"
            exit 1
          fi
          echo "Found coverage file: $COVERAGE_FILE"
          mkdir -p src
          cp "$COVERAGE_FILE" "src/$(basename "$COVERAGE_FILE")"

      - name: Run SonarQube Scan
        if: inputs.source_path != '' && inputs.sonar_project_key != ''
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4 # v7.1.0
        with:
          projectBaseDir: ${{ inputs.source_path }}
          args: >
            -Dsonar.projectKey=${{ inputs.sonar_project_key }}
            -Dsonar.projectName=${{ inputs.sonar_project_key }}
            -Dsonar.sources=.
            -Dsonar.ci.autoconfig.disabled=true
            -Dsonar.exclusions=**/__pycache__/**,**/*.pyc,**/.terraform/**,**/node_modules/**,**/dist/**,**/lib/**,**/requirements.in

      - name: SonarQube Quality Gate Check
        if: inputs.source_path != '' && inputs.sonar_project_key != ''
        uses: sonarsource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        with:
          scanMetadataReportFile: ${{ inputs.source_path }}/.scannerwork/report-task.txt
