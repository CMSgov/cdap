name: code-checks (reusable)

on:
  workflow_call:
    inputs:
      app:
        description: 'App name (ab2d, bcda, cdap, dpc)'
        required: true
        type: string
      ref:
        description: 'Git ref (branch, tag, or SHA) to scan — defaults to the calling ref'
        required: false
        type: string
    secrets:
      PROD_ACCOUNT:
        description: 'AWS prod account ID'
        required: true

env:
  SNYK_CLI_VERSION: 1.1306.2

jobs:
  checks:
    name: 'Snyk Code Scan (${{ inputs.app }})'
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    runs-on: codebuild-${{ inputs.app }}-prod-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Validate app input
        env:
          APP: ${{ inputs.app }}
        run: |
          case "$APP" in
            ab2d|bcda|cdap|dpc) ;;
            *) echo "::error::app must be one of ab2d, bcda, cdap, dpc"; exit 1 ;;
          esac

      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.3.0
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.PROD_ACCOUNT }}:role/delegatedadmin/developer/${{ inputs.app }}-prod-github-actions
          aws-region: ${{ vars.AWS_REGION }}

      - uses: cmsgov/cdap/actions/aws-params-env-action@main
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        with:
          params: |
            SNYK_TOKEN=/cdap/prod/code-checks/sensitive/snyk-api-token/${{ inputs.app }}

      # Install Snyk (authenticates via the SNYK_TOKEN env var automatically)
      - name: Install Snyk
        run: |
          sudo npm install -g snyk@${SNYK_CLI_VERSION}

      - name: Run Snyk Code
        env:
          PROJECT_NAME: ${{ github.repository }}-code-checks
        run: |
          EXIT_CODE=0
          snyk code test --report --project-name="$PROJECT_NAME" || EXIT_CODE=$?
          echo "Snyk exit code ${EXIT_CODE}"
          # Exit code 1 means vulnerabilities were found. Don't fail the workflow.
          if [ "$EXIT_CODE" -eq 1 ]; then exit 0; else exit "$EXIT_CODE"; fi
