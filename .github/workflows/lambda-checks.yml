name: Lambda Functions — Code Checks

on:
  push:
    branches: [main]
    paths:
      - 'terraform/services/**/lambda_src/**'
  pull_request:
    paths:
      - 'terraform/services/**/lambda_src/**'
      - '.github/workflows/lambda-checks.yml'
      - '.github/workflows/checks-reusable.yml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service name (must match a directory under terraform/services/)'
        required: true
        type: string

jobs:
  detect-changes:
    name: Detect Changed Lambda Functions
    runs-on: codebuild-cdap-non-prod-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      any_changed: ${{ steps.detect.outputs.any_changed }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.0
        with:
          fetch-depth: 0

      - uses: cmsgov/cdap/actions/setup-yq@f4c14d47cc20e7f6de9112d7155af1213c9bca5a

      - name: Detect changed lambda functions and build matrix
        id: detect
        env:
          EVENT_NAME:    ${{ github.event_name }}
          INPUT_SERVICE: ${{ inputs.service }}
          BASE_SHA:      ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA:      ${{ github.sha }}
        run: |
          skip() {
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
            echo "matrix=[]"        >> "$GITHUB_OUTPUT"
            exit 0
          }

          add_entry() {
            local svc="$1"
            local svc_name cfg default_cfg merged test_cmd language language_version sonar_args
            local src_dir="terraform/services/$svc/lambda_src"

            svc_name=$(echo "$svc" | sed 's/^[0-9]*-//')

            if [ -f "$src_dir/go.mod" ]; then
              language="go"; default_version="1.22"
              default_test_cmd='go mod download && go test ./... -coverprofile=coverage/coverage.out'
              sonar_args="-Dsonar.go.coverage.reportPaths=src/coverage.out"
            elif [ -f "$src_dir/package.json" ]; then
              language="node"; default_version="20"
              default_test_cmd='npm ci && npm test -- --coverage --coverageDirectory=coverage'
              sonar_args="-Dsonar.javascript.lcov.reportPaths=src/coverage.lcov"
            elif [ -f "$src_dir/requirements.txt" ]; then
              language="python"; default_version="3.13"
              default_test_cmd='pip install -r requirements.txt -r requirements-dev.txt && pytest --cov=. --cov-report=xml:coverage/coverage.xml'
              sonar_args=""
            else
              echo "$svc: no recognized language marker (go.mod / package.json / requirements.txt) — skipping"
              return
            fi

            cfg="terraform/services/$svc/config/test.yml"
            default_cfg="terraform/services/$svc/config/default.yml"
            if [ -f "$default_cfg" ] && [ -f "$cfg" ]; then
              merged=$(yq ". as \$env | load(\"$default_cfg\") * \$env" "$cfg")
            elif [ -f "$cfg" ]; then
              merged=$(cat "$cfg")
            elif [ -f "$default_cfg" ]; then
              merged=$(cat "$default_cfg")
            else
              merged="{}"
            fi

            [ "$(echo "$merged" | yq '.lambda.enabled // true')" != "true" ] && {
              echo "$svc: lambda.enabled is false — skipping"; return
            }

            test_cmd=$(echo "$merged" | yq ".lambda.test_command // \"$default_test_cmd\"")
            language_version=$(echo "$merged" | yq ".lambda.language_version // \"$default_version\"")
            sonar_args=$(echo "$merged" | yq ".lambda.sonar_extra_args // \"$sonar_args\"")

            entry=$(jq -cn \
              --arg svc              "$svc"         \
              --arg svc_name         "$svc_name"    \
              --arg test_cmd         "$test_cmd"    \
              --arg language         "$language"    \
              --arg language_version "$language_version" \
              --arg sonar_args       "$sonar_args"  \
              '{service: $svc, service_name: $svc_name, test_command: $test_cmd,
                language: $language, language_version: $language_version,
                sonar_extra_args: $sonar_args}')

            ENTRIES=$(echo "$ENTRIES" | jq -c --argjson e "$entry" '. + [$e]')
          }

          # MAIN

          ENTRIES="[]"

          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            add_entry "$INPUT_SERVICE"
          else
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]; then
              BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
            fi

            CHANGED_SERVICES=$(
              git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
                | grep '^terraform/services/[^/]*/lambda_src/' \
                | sed 's|terraform/services/\([^/]*\)/lambda_src/.*|\1|' \
                | sort -u
            )
            echo "Changed lambda functions: $CHANGED_SERVICES"

            for SVC in $CHANGED_SERVICES; do
              add_entry "$SVC"
            done
          fi

          # OUTPUTS

          if [ "$ENTRIES" == "[]" ] || [ -z "$ENTRIES" ]; then skip; fi

          echo "any_changed=true" >> "$GITHUB_OUTPUT"
          echo "matrix=$ENTRIES"  >> "$GITHUB_OUTPUT"

  code-checks:
    name: Code Checks — ${{ matrix.service }}
    needs: [detect-changes]
    if: needs.detect-changes.outputs.any_changed == 'true'
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    uses: ./.github/workflows/checks-reusable.yml
    secrets: inherit
    with:
      source_path:       terraform/services/${{ matrix.service }}/lambda_src
      sonar_project_key: cdap-${{ matrix.service_name }}
      sonar_extra_args:  ${{ matrix.sonar_extra_args }}
      service_name:      ${{ matrix.service_name }}
      test_command:      ${{ matrix.test_command }}
      language:          ${{ matrix.language }}
      language_version:  ${{ matrix.language_version }}
