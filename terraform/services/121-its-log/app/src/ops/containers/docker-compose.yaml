services:
  itslog:
    image: itslog-api
    command: /app/entrypoint.bash
    attach: false
    stdin_open: true
    tty: true
    deploy:
      replicas: 2
    volumes:
      - ${HOME}/.its-log/data:/data
      - ${HOME}/.its-log/archive:/archive
      - ${HOME}/.its-log/export:/export
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/v1/health"]
      interval: 300s
      retries: 1
      start_period: 5s
      timeout: 3s
  proxy:
    image: nginx:alpine
    attach: false
    stdin_open: true
    tty: true
    ports:
      - "8888:8888"
    volumes:
      - ./itslog/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./itslog/scripts:/docker-entrypoint.d
    depends_on:
      - itslog
