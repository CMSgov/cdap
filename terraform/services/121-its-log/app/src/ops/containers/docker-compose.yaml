services:
  itslog:
    image: itslog-api
    command: /app/entrypoint.bash
    deploy:
      replicas: 2
    expose:
      - "80"
      - "8888"
    volumes:
      - ${HOME}/.its-log/data:/data
      - ${HOME}/.its-log/archive:/archive
      - ${HOME}/.its-log/export:/export
    healthcheck:
      test: ["CMD", "curl", "-f", "http://itslog:8888/v1/health"]
      interval: 300s
      retries: 1
      start_period: 5s
      timeout: 3s
  proxy:
    image: nginx:alpine
    ports:
      - "8888:80"
    volumes:
      - ./itslog/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - itslog