info:
  name: health check
  type: http
  seq: 1

http:
  method: GET
  url: "{{scheme}}://{{host}}:{{port}}/v1/health"
  auth: inherit

runtime:
  variables:
    - name: host
      value: localhost
    - name: port
      value: "8888"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
