info:
  name: run sentinel etl
  type: http
  seq: 7

http:
  method: POST
  url: "{{scheme}}://{{host}}:{{port}}/v1/etl/run"
  headers:
    - name: x-api-key
      value: "{{api-key-admin}}"
  body:
    type: json
    data: |-
      {
        "kind": "daily",
        "name": "sentinel",
        "destination": "summary",
        "ymd": "{{YMD}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
