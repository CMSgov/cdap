info:
  name: run sentinel etl
  type: http
  seq: 7

http:
  method: POST
  url: "{{scheme}}://{{host}}:{{port}}/v1/etl/run"
  headers:
    - name: x-api-key
      value: "{{api-key-admin}}"
  body:
    type: json
    data: |-
      {
        "kind": "daily",
        "name": "sentinel",
        "destination": "summary",
        "ymd": "{{YMD}}",
        "params": [
          { 
            "name": "importantnumber",
            "value": 8,
            "type": "int"
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const btoa = require("btoa");
        sql = `
        select into summary reject for keyword
        `
        encoded = btoa(sql.trim())
        bru.setVar("B64", encoded);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
