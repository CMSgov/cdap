ecs:
  cluster: null

stack:
  infra_enabled: true # ACM cert and ALB, no compute; can be left applied
  services_enabled: false # ECS services, runs fargate tasks; turn off after testing

domain:
  name: null

datadog_synthetics:
  available: true
  enabled: true
  min_failure_duration: 300
  tick_every: 300

services:
  caller:
    cpu: 512
    memory: 1024
    deployment_rollback: true
  worker:
    cpu: 512
    memory: 1024
    deployment_rollback: true
