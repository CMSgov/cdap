ecs:
  cluster: null

stack:
  infra_enabled: true # ACM cert and ALB, no compute; can be left applied
  services_enabled: false # ECS services, runs fargate tasks; turn off after testing

domain:
  name: null

datadog_synthetics:
  available: true
  enabled: true
  min_failure_duration: 300
  tick_every: 300

# SRE guidance: provide these options for developers to easily change
services:
  caller:
    cpu: 128
    memory: 256
    deployment_rollback: false
  worker:
    cpu: 128
    memory: 256
    deployment_rollback: false
