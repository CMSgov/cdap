ecs:
  cluster: cdap-test-tftesting # established in 610-tftesting-cluster

datadog_synthetics:
  enabled: true # May require propagation of internal hosted zone by cms
  available: true

stack:
  infra_enabled: true # ACM cert + ALB — no compute, can be left applied
  services_enabled: false # ECS services, runs fargate tasks; turn off after testing

# An example of how some settings can be present to override defaults in a given environment
services:
  caller:
    cpu: 256
    memory: 256
    deployment_rollback: false
  worker:
    deployment_rollback: false
